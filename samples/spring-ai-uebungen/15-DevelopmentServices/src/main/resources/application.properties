spring.application.name=15-DevelopmentServices
server.port=${PORT:8095}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never
springdoc.swagger-ui.path=/swagger-ui.html
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start-only
training.cassandra.host=${CASSANDRA_HOST:localhost}
training.cassandra.port=${CASSANDRA_PORT:9042}
training.cassandra.datacenter=${CASSANDRA_DATACENTER:datacenter1}
training.cassandra.keyspace=${CASSANDRA_KEYSPACE:spring_ai}
