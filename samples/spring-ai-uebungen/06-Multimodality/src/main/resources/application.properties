spring.application.name=06-Multimodality
server.port=${PORT:8086}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never
springdoc.swagger-ui.path=/swagger-ui.html
spring.ai.ollama.chat.options.model=${OLLAMA_VISION_MODEL:llava:7b}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
